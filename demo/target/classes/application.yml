spring:
  datasource:
    url: jdbc:h2:mem:freelance
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop  # Create schema on startup, drop on shutdown
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true  # Wait for Hibernate to create tables first

  sql:
    init:
      mode: never  # Disable automatic data.sql execution

server:
  port: 8082
