spring:
  datasource:
    url: jdbc:mysql://localhost:3306/freelance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # Options: create | create-drop | update | validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  sql:
    init:
      mode: never            # ⛔ Disable auto-run of data.sql to prevent duplicate inserts
      platform: mysql

server:
  port: 8082
