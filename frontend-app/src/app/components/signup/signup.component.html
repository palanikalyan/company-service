<div class="min-h-screen flex items-center justify-center bg-white py-12 px-4">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200" style="box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full mb-4">
        <i class="pi pi-building text-white text-2xl"></i>
      </div>
      <h2 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h2>
      <p class="text-gray-600">Join as a Company User</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
          Username <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="username"
          [(ngModel)]="user.username"
          name="username"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Choose a username"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          id="email"
          [(ngModel)]="user.email"
          name="email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="your.email@company.com"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="password"
          [(ngModel)]="user.password"
          name="password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Minimum 5 characters"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirm Password <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="user.confirmPassword"
          name="confirmPassword"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Re-enter your password"
        />
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-center gap-2">
        <i class="pi pi-check-circle"></i>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center gap-2">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg"
      >
        <span *ngIf="!isLoading" class="flex items-center justify-center gap-2">
          <i class="pi pi-user-plus"></i>
          <span>Create Account</span>
        </span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
          <i class="pi pi-spin pi-spinner"></i>
          <span>Creating Account...</span>
        </span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="mt-6 text-center">
      <p class="text-gray-600">
        Already have an account? 
        <a routerLink="/login" class="text-blue-600 hover:text-blue-700 font-semibold ml-1">
          Sign in here
        </a>
      </p>
    </div>

    <!-- Info Box -->
    <div class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-lg">
      <div class="flex gap-3">
        <i class="pi pi-info-circle text-blue-600 mt-0.5"></i>
        <div class="text-sm text-gray-700">
          <p class="font-semibold text-blue-700 mb-1">Company User Account</p>
          <p>You'll be able to manage your company's information, view financial data, and update bank details.</p>
        </div>
      </div>
    </div>
  </div>
</div>
