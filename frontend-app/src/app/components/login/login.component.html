<div class="min-h-screen flex items-center justify-center bg-white">
  <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-200" style="box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Company Management Login</h2>
    
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter your username"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter your password"
        />
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-600">
        Don't have an account? 
        <a routerLink="/signup" class="text-blue-600 hover:text-blue-700 font-semibold ml-1">
          Sign up here
        </a>
      </p>
    </div>

    <div class="mt-6 text-center text-sm text-gray-600">
      <p>Admin users will be redirected to the admin dashboard</p>
      <p>Company users will be redirected to the company dashboard</p>
    </div>
  </div>
</div>
